plugins {
    id 'java'
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

group = 'it.unicam.cs.mpgc.rpg129543'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

// Configurazione specifica per JavaFX
javafx {
    version = "25"
    modules = [ 'javafx.controls', 'javafx.fxml' ]
}

dependencies {
    // Jackson per la persistenza JSON (richiesto nel tuo module-info)
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.15.2'

    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

application {
    mainClass = 'it.unicam.cs.mpgc.rpg129543.Launcher'
}